<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f4f82">
<meta name="description" content="Consultant surgical ward round checklist">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="apple-touch-icon" href="./icon.svg">
<title>Consultant Ward Round</title>
<style>
:root{--bg:#f4f8fc;--card:#fff;--text:#132238;--muted:#68778c;--line:#dce5ef;--blue:#1769aa;--blue2:#0f4f82;--green:#178a52;--red:#c63c3c;--amber:#b66a00;--urgent-bg:#fff0f0;--review-bg:#fff9e8;--stable-bg:#eefaf3;--shadow:0 4px 16px rgba(20,40,70,.06)}
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,"Segoe UI",sans-serif;background:var(--bg);color:var(--text);line-height:1.6}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:11px;padding:10px 14px;font-size:13px;font-weight:700}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #78aee7;outline-offset:2px}a{text-decoration:none}header{background:linear-gradient(135deg,var(--blue2),var(--blue));color:#fff;padding:16px max(16px,calc((100vw - 950px)/2));position:sticky;top:0;z-index:10;box-shadow:0 3px 12px #19395414}header h1{font-size:21px;margin:0;font-weight:800}header p{font-size:12px;margin:3px 0 0;opacity:.85}.headerrow{display:flex;align-items:center;justify-content:space-between;gap:10px}.headpill{border:1px solid #ffffff66;background:#ffffff18;border-radius:999px;padding:4px 10px;font-size:11px;white-space:nowrap}main{max-width:950px;margin:auto;padding:14px 14px 110px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:13px;box-shadow:var(--shadow)}.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.muted{font-size:12px;color:var(--muted)}.title{font-size:17px;font-weight:800;margin:0 0 7px;color:#17354e}.primary{color:#fff;background:var(--blue)}.secondary{color:var(--blue2);background:#e9f2fb}.success{color:#fff;background:var(--green)}.danger{color:var(--red);background:#fdecec}.gray{color:#465769;background:#eaf0f4}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-bottom:12px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px 5px;text-align:center}.stat b{display:block;color:var(--blue);font-size:23px;line-height:1.25}.stat span{font-size:11px;color:var(--muted)}.stat.red b{color:var(--red)}.stat.yellow b{color:var(--amber)}.stat.green b{color:var(--green)}input,select,textarea{width:100%;padding:10px 11px;background:white;border:1px solid #cfd9e5;border-radius:10px;color:var(--text);font-size:14px;min-width:0}textarea{resize:vertical;min-height:60px;line-height:1.6}.searchrow{display:flex;gap:8px;align-items:center}.searchrow input{flex:1}label{font-size:12px;font-weight:800;color:#41556b;display:block;margin-bottom:5px}.ward-head{display:flex;align-items:center;justify-content:space-between;padding:5px 3px;margin:15px 0 8px;color:var(--blue2)}.ward-head h2{margin:0;font-size:17px}.ward-head span{background:#e8f2fb;border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700}.pt{width:100%;display:block;text-align:left;border:1px solid var(--line);border-left:7px solid #2b9255;border-radius:14px;padding:12px 12px 12px 10px;margin-bottom:9px;background:var(--stable-bg);color:var(--text);box-shadow:0 2px 5px #14243a06}.pt.urgent{background:var(--urgent-bg);border-left-color:var(--red)}.pt.review{background:var(--review-bg);border-left-color:#e6a300}.pt.stable{background:var(--stable-bg);border-left-color:var(--green)}.pt-top{display:flex;align-items:center;justify-content:space-between;gap:10px}.pt-name{font-size:16px;font-weight:800}.tag{display:inline-flex;align-items:center;border-radius:999px;padding:3px 10px;font-size:11px;font-weight:800;white-space:nowrap;background:#fff;border:1px solid #e1e5e9}.tag.urgent{color:var(--red);border-color:#f0b6b6}.tag.review{color:var(--amber);border-color:#e7c88e}.tag.stable{color:var(--green);border-color:#b1dec5}.pt-meta{display:flex;flex-wrap:wrap;gap:5px 11px;font-size:12px;margin-top:6px;color:#4f6073}.pt-dx{font-weight:700;font-size:13px;margin-top:7px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tiny{font-size:11px;color:#68778c}.filterbar{display:flex;gap:5px;overflow:auto;margin-top:10px}.filterbtn{white-space:nowrap;background:#edf3f9;color:#567086;padding:7px 11px;font-size:12px}.filterbtn.active{color:#fff;background:var(--blue)}.btnrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.sectiontitle{font-weight:800;color:var(--blue2);font-size:17px;margin:18px 0 9px}.detailmeta{display:grid;grid-template-columns:repeat(3,1fr);gap:9px}.metabox{background:#f8fbfe;border:1px solid var(--line);border-radius:11px;padding:8px 10px;font-size:12px;min-width:0}.metabox span{display:block;font-size:11px;color:var(--muted)}.metabox strong{overflow-wrap:anywhere}.priorityset{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}.ps{border:1px solid var(--line);background:#fff;color:#65788d;padding:8px 3px;font-size:12px}.ps.urgent.active{background:var(--urgent-bg);border-color:#ec7b7b;color:var(--red)}.ps.review.active{background:var(--review-bg);border-color:#e6bc65;color:#996000}.ps.stable.active{background:var(--stable-bg);border-color:#78c69c;color:var(--green)}.checkgroup{margin:13px 0 0}.checkgroup h3{background:#e9f2fb;color:#0f4f82;margin:0;padding:10px 12px;border-radius:11px 11px 0 0;font-size:14px}.checkitem{border:1px solid var(--line);border-top:0;background:#fff;padding:12px}.checkitem:last-child{border-radius:0 0 12px 12px}.itemtop{display:flex;justify-content:space-between;align-items:center;gap:9px;flex-wrap:wrap}.checkname{font-weight:800;font-size:13px}.en{display:block;color:#758395;direction:ltr;text-align:left;font-size:11px;font-weight:400}.statechoices{display:flex;gap:5px;flex-wrap:wrap}.choice{background:#f1f5f8;border:1px solid #dce5ed;color:#657b8c;font-size:11px;padding:5px 9px}.choice.ok.sel{color:var(--green);background:var(--stable-bg);border-color:#8fd0a9}.choice.action.sel{color:var(--amber);background:var(--review-bg);border-color:#e7c072}.choice.na.sel{background:#e9eef2;color:#3b5669;border-color:#b4c3d0}.actionline{margin-top:8px}.actionline input{background:#fbfcfe;font-size:13px;padding:10px 12px}.actionline input:focus{background:#fff}.actionline label{margin-bottom:4px;color:#64768b}.summaryline{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}.summarybox{white-space:pre-wrap;line-height:1.9;border-left:4px solid var(--blue);padding:10px 13px;background:#f7fbfe;border-radius:10px;font-size:12px;min-height:44px;overflow-wrap:anywhere}.wa{background:#16844c;color:#fff}.alert{background:#fff8e8;border:1px solid #f1dfad;padding:10px;border-radius:10px;font-size:11px;color:#876626;margin:10px 0}.stickybar{position:sticky;bottom:0;z-index:8;background:#f4f8fcf5;border-top:1px solid #cbd9e8;padding:11px 0;backdrop-filter:blur(6px)}.stickin{display:flex;gap:7px;max-width:950px;margin:auto;padding:0 14px}.stickin button{flex:1}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.full{grid-column:1/-1}.modalmask{position:fixed;inset:0;display:flex;align-items:flex-end;justify-content:center;background:#13243699;z-index:50}.modal{width:min(550px,100%);max-height:90vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:18px;background:#fff;box-shadow:0 0 40px #1113}.modal .h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.modal h2{font-size:19px;margin:0}.close{font-size:23px;background:#eef3f7;color:#20354c;width:38px;height:38px;border-radius:50%;padding:0}.modal hr{border:0;border-top:1px solid var(--line);margin:15px 0}.modal-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.modal-list button{padding:6px 9px}.noitems{text-align:center;color:#798797;margin:26px 0}.footer{font-size:11px;color:#8393a5;text-align:center;padding:12px}.arrow{font-size:20px;background:transparent;color:#fff;padding:0 3px}.printonly{display:none}.countpill{font-size:12px;background:#e9f2fb;color:var(--blue2);padding:4px 10px;border-radius:999px;font-weight:800}
@media(max-width:570px){.stats{grid-template-columns:repeat(4,1fr);gap:5px}.stat{padding:9px 2px}.stat b{font-size:20px}.stat span{font-size:10px}header{padding:12px 14px}.headerrow h1{font-size:18px}.detailmeta{grid-template-columns:repeat(2,minmax(0,1fr))}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}.itemtop{display:block}.statechoices{margin-top:7px}.pt-meta{font-size:11px}}
@media print{*{box-shadow:none!important}body{background:#fff;color:#000;font-family:Arial,sans-serif}header,.screenonly,.stickybar,.modalmask{display:none!important}.printonly{display:block!important}main{max-width:none;padding:0}.printpage{page-break-after:always;padding:8mm}.printhead{border-bottom:2px solid #0f4f82;padding-bottom:8px;margin-bottom:10px}.printhead h2{margin:0;font-size:16px}.printrow{display:flex;gap:15px;flex-wrap:wrap;border-bottom:1px solid #d7dfe4;padding:6px 0;font-size:11px}.printgrid{display:grid;grid-template-columns:1fr 1fr;gap:5px}.printitem{border:1px solid #ccd8e4;padding:7px;break-inside:avoid;page-break-inside:avoid;font-size:11px}.printitem strong{display:block}.printitem em{display:block;margin-top:6px;color:#6d7481;font-style:normal}.printsummary{white-space:pre-wrap;font-size:11px;margin-top:15px} @page{size:A4;margin:9mm}}
</style>
</head>
<body>
<header><div class="headerrow"><div><h1 id="headerTitle">Consultant Ward Round</h1><p id="headerSub">Clinical checklist · WardTrack colours & priority</p></div><span class="headpill">Surgical Ward Round</span></div></header>
<main id="screen" class="screenonly"></main>
<div id="stickyAction" class="stickybar screenonly" style="display:none"><div class="stickin"><button class="secondary" id="stickyPrint">🖨 Print Checklist</button><button class="wa" id="stickyWhatsapp">WhatsApp · <span id="stickyNum">0</span> actions</button></div></div>
<div id="modalRoot"></div>
<div id="printRoot" class="printonly"></div>
<script>
'use strict';
const STORE='ward-round-group-a-v1';
const DEFAULT_WARDS=['ER','MSW','FSW','MMW','FMW','BURN','ICU','CCU','oncology unit'];
const priorityMeta={urgent:{label:'Urgent',emoji:'🔴'},review:{label:'Follow-up',emoji:'🟡'},stable:{label:'Stable',emoji:'🟢'}};
const groups=[
 {title:'Clinical Review',items:[['overnight','Overnight events','Overnight events and clinical trend'],['vitals','Vital signs','Vitals / NEWS / trends'],['exam','Clinical examination','Clinical and abdominal examination'],['pain','Pain management','Pain assessment and analgesia'],['wound','Wound & dressing','Wound evaluation and dressing']]},
 {title:'Surgical Care',items:[['drains','Drains, tubes & stoma','Drains / NGT / Foley / stoma'],['bowel','Bowel & urinary function','Bowel function / urine output'],['diet','Diet & fasting','Diet / NPO / oral intake'],['fluid','Fluids & electrolytes','Fluid balance / electrolytes'],['mobility','Mobilisation','Mobilisation / rehabilitation']]},
 {title:'Safety & Management Plan',items:[['labs','Laboratory & imaging','Labs / imaging / pending results'],['meds','Medications & antibiotics','Medication reconciliation / antibiotics'],['vte','VTE prevention','VTE risk and prophylaxis'],['risks','Complications & red flags','Complications / warning signs'],['plan','Daily plan & escalation','Plan for next 24 hours / escalation'],['discharge','Discharge planning','Discharge readiness and barriers']]}
];
let state={wards:[...DEFAULT_WARDS],patients:[]};
let current=null,view='home',filter='all',query='',roundDate=dateToday();
function dateToday(){const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(state))}catch(e){}}
function load(){try{const x=JSON.parse(localStorage.getItem(STORE)||'null');if(x&&Array.isArray(x.wards)&&Array.isArray(x.patients)){state=x}}catch(e){};state.wards=[...new Set([...DEFAULT_WARDS,...state.wards])];}
function getP(){return state.patients.find(x=>x.id===current)}
function getRound(p){p.rounds=p.rounds||{};p.rounds[roundDate]=p.rounds[roundDate]||{};return p.rounds[roundDate]}
function itemsAction(p){const r=getRound(p);return groups.flatMap(g=>g.items).map(([k,label])=>({k,label,v:String(r[k]?.action||'').trim(),status:r[k]?.status||''})).filter(x=>x.v&&x.status!=='na')}
function pill(p){return `<span class="tag ${p.priority||'stable'}">${priorityMeta[p.priority||'stable'].emoji} ${priorityMeta[p.priority||'stable'].label}</span>`}
function render(){document.getElementById('modalRoot').innerHTML='';document.getElementById('headerTitle').textContent=view==='home'?'Consultant Ward Round':'Patient Review · Consultant Round';document.getElementById('headerSub').textContent=view==='home'?'Patient list · WardTrack colours and triage priority':'Consultant-only checklist · Actions under each item';const bar=document.getElementById('stickyAction');bar.style.display=view==='detail'?'block':'none';view==='home'?renderHome():renderDetail()}
function renderHome(){const all=state.patients;const filtered=all.filter(p=>filter==='all'||p.priority===filter).filter(p=>[p.name,p.mrn,p.ward,p.room,p.bed,p.diagnosis].join(' ').toLowerCase().includes(query.toLowerCase()));const s=document.getElementById('screen');s.innerHTML=`<div class="stats"><div class="stat"><b>${all.length}</b><span>Total Patients</span></div><div class="stat red"><b>${all.filter(p=>p.priority==='urgent').length}</b><span>Urgent</span></div><div class="stat yellow"><b>${all.filter(p=>p.priority==='review').length}</b><span>Follow-up</span></div><div class="stat green"><b>${all.filter(p=>p.priority==='stable').length}</b><span>Stable</span></div></div><div class="card"><div class="row"><h2 class="title" style="margin:0">Patients</h2><div class="btnrow"><button class="secondary" id="blankPrintBtn">🖨 Blank A4 Checklist</button><button class="primary" id="addP">＋ Add Patient</button></div></div><div style="height:10px"></div><input id="search" placeholder="Search name, MRN, ward, room or diagnosis" value="${esc(query)}"><div class="filterbar"><button class="filterbtn ${filter==='all'?'active':''}" data-filter="all">All</button><button class="filterbtn ${filter==='urgent'?'active':''}" data-filter="urgent">🔴 Urgent</button><button class="filterbtn ${filter==='review'?'active':''}" data-filter="review">🟡 Follow-up</button><button class="filterbtn ${filter==='stable'?'active':''}" data-filter="stable">🟢 Stable</button></div></div><div id="patientList"></div><p class="footer">Pilot version: browser data is stored locally, unencrypted and unsynchronised. Obtain hospital approval before entering real patient data.</p>`;
let out='';for(const w of state.wards){const arr=filtered.filter(p=>p.ward===w).sort((a,b)=>['urgent','review','stable'].indexOf(a.priority)-['urgent','review','stable'].indexOf(b.priority)||String(a.room).localeCompare(String(b.room),undefined,{numeric:true}));if(!arr.length)continue;out+=`<div class="ward-head"><h2>Ward ${esc(w)}</h2><span>${arr.length} patients</span></div>`;for(const p of arr)out+=`<button class="pt ${esc(p.priority||'stable')}" data-open="${esc(p.id)}"><div class="pt-top"><span class="pt-name">${esc(p.name)}</span>${pill(p)}</div><div class="pt-meta"><span>MRN: <b dir="ltr">${esc(p.mrn)}</b></span><span>Ward: <b>${esc(p.ward)}</b></span><span>Room: <b>${esc(p.room)}</b></span><span>Bed: <b>${esc(p.bed)}</b></span></div><div class="pt-dx">Diagnosis: ${esc(p.diagnosis)}</div></button>`}
document.getElementById('patientList').innerHTML=out||'<div class="card noitems">No patients yet. Select Add Patient to begin.</div>';
s.querySelector('#search').oninput=e=>{query=e.target.value;renderHome();document.querySelector('#search').focus();document.querySelector('#search').setSelectionRange(query.length,query.length)};
s.querySelector('#addP').onclick=()=>patientModal();s.querySelector('#blankPrintBtn').onclick=()=>printBlank();s.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;renderHome()});s.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{current=b.dataset.open;view='detail';render();window.scrollTo(0,0)});}
function renderDetail(){const p=getP();if(!p){view='home';return render()}const r=getRound(p);const count=itemsAction(p).length;const s=document.getElementById('screen');let html=`<div class="btnrow" style="margin:5px 0 11px"><button class="secondary" id="back">← Back to Patients</button><button class="secondary" id="edit">✎ Edit Patient</button><button class="danger" id="remove">Delete</button></div><div class="card"><div class="row"><div><h2 class="title" style="margin-bottom:2px">${esc(p.name)}</h2><span class="muted">${esc(p.diagnosis)}</span></div>${pill(p)}</div><div class="detailmeta" style="margin-top:13px"><div class="metabox"><span>Medical Record Number</span><strong dir="ltr">${esc(p.mrn)}</strong></div><div class="metabox"><span>Ward</span><strong>${esc(p.ward)}</strong></div><div class="metabox"><span>Room</span><strong>${esc(p.room)}</strong></div><div class="metabox"><span>Bed</span><strong>${esc(p.bed)}</strong></div><div class="metabox"><span>Assigned Resident</span><strong>${esc(p.resident||'Not assigned')}</strong></div><div class="metabox"><span>Round Date</span><input type="date" id="roundDate" style="padding:3px 6px;min-height:28px" value="${esc(roundDate)}"></div></div><label style="margin-top:12px">Priority · WardTrack triage</label><div class="priorityset"><button class="ps urgent ${p.priority==='urgent'?'active':''}" data-priority="urgent">🔴 Urgent</button><button class="ps review ${p.priority==='review'?'active':''}" data-priority="review">🟡 Follow-up</button><button class="ps stable ${p.priority==='stable'?'active':''}" data-priority="stable">🟢 Stable</button></div></div><div class="card"><div class="summaryline"><div><h2 class="title" style="margin:0">Resident Action Summary</h2><span class="muted">Automatically collected from the action fields</span></div><span class="countpill" id="actionCount">${count} actions</span></div><div class="summarybox" id="summaryBox" style="margin-top:10px">${esc(summaryText(p))}</div><div class="btnrow" style="margin-top:10px"><button class="wa" id="sendWhats">WhatsApp Resident · ${count}</button><button class="secondary" id="copyActions">Copy Actions</button></div></div><div class="row" style="margin-top:19px"><h2 class="title">Consultant Checklist</h2><span class="muted">16 items</span></div>`;
for(const g of groups){html+=`<section class="checkgroup"><h3>${esc(g.title)}</h3>`;for(const [k,label,en] of g.items){const v=r[k]||{};html+=`<div class="checkitem"><div class="itemtop"><div><div class="checkname">${esc(label)}</div><span class="en">${esc(en)}</span></div><div class="statechoices"><button class="choice ok ${v.status==='ok'?'sel':''}" data-status="${k}:ok">✓ Reviewed</button><button class="choice action ${v.status==='action'?'sel':''}" data-status="${k}:action">! Action</button><button class="choice na ${v.status==='na'?'sel':''}" data-status="${k}:na">— N/A</button></div></div><div class="actionline"><label for="action-${k}">Action required</label><input data-action="${k}" id="action-${k}" placeholder="Enter an action or instruction (if needed)" value="${esc(v.action||'')}"></div></div>`}html+='</section>'}
html+=`<div class="alert">WhatsApp opens one draft containing the patient name, MRN and all recorded actions. It does not send automatically. Patient identifiers are confidential: use only a hospital-approved secure channel. Official clinical documentation remains mandatory.</div><div class="card"><div class="row"><span class="muted">Printout includes only the consultant checklist and recorded actions.</span><button class="secondary" id="printCase">🖨 Print Checklist</button></div></div>`;s.innerHTML=html;
s.querySelector('#back').onclick=()=>{view='home';render();window.scrollTo(0,0)};s.querySelector('#edit').onclick=()=>patientModal(p);s.querySelector('#remove').onclick=()=>{if(confirm('Delete this patient record and locally saved rounds permanently?')){state.patients=state.patients.filter(x=>x.id!==p.id);persist();view='home';render()}};
s.querySelector('#roundDate').onchange=e=>{roundDate=e.target.value||dateToday();renderDetail()};s.querySelectorAll('[data-priority]').forEach(b=>b.onclick=()=>{p.priority=b.dataset.priority;persist();renderDetail()});
s.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>{const [k,v]=b.dataset.status.split(':');r[k]=r[k]||{};r[k].status=r[k].status===v?'':v;persist();b.closest('.statechoices').querySelectorAll('[data-status]').forEach(button=>{const opt=button.dataset.status.split(':')[1];const chosen=r[k].status===opt;button.classList.toggle('sel',chosen);button.setAttribute('aria-pressed',String(chosen))});updateSummary(p)});
s.querySelectorAll('[data-action]').forEach(el=>el.oninput=e=>{const k=e.target.dataset.action;r[k]=r[k]||{};r[k].action=e.target.value;if(r[k].action.trim()){r[k].status='action';const group=el.closest('.checkitem').querySelector('.statechoices');group.querySelectorAll('[data-status]').forEach(button=>{const chosen=button.dataset.status.endsWith(':action');button.classList.toggle('sel',chosen);button.setAttribute('aria-pressed',String(chosen))})}persist();updateSummary(p)});
s.querySelector('#sendWhats').onclick=()=>sendWhats(p);s.querySelector('#copyActions').onclick=()=>copyActions(p);s.querySelector('#printCase').onclick=()=>printCase(p);
document.getElementById('stickyWhatsapp').onclick=()=>sendWhats(p);document.getElementById('stickyPrint').onclick=()=>printCase(p);updateSummary(p);
}
function summaryText(p){const acts=itemsAction(p);return acts.length?acts.map((o,i)=>`${i+1}. ${o.label}: ${o.v}`).join('\n'):'No actions recorded yet.'}
function updateSummary(p){const n=itemsAction(p).length;for(const id of ['actionCount','stickyNum']){let e=document.getElementById(id);if(e)e.textContent=id==='actionCount'?`${n} actions`:n}const box=document.getElementById('summaryBox');if(box)box.textContent=summaryText(p);const btn=document.getElementById('sendWhats');if(btn)btn.textContent=`WhatsApp Resident · ${n}`;}
function whatsappText(p){const acts=itemsAction(p);return `Consultant Ward Round
Date: ${roundDate}
Patient: ${p.name||'Not provided'}
MRN: ${p.mrn||'Not provided'}
Ward: ${p.ward||'-'} | Room: ${p.room||'-'} | Bed: ${p.bed||'-'}
Diagnosis: ${p.diagnosis||'Not provided'}
Priority: ${priorityMeta[p.priority]?.label||'Not set'}
Resident: ${p.resident||'Assigned resident'}

Actions (${acts.length}):
${acts.map((x,i)=>`${i+1}. ${x.label}: ${x.v}`).join('\n')||'No actions recorded'}

Please acknowledge receipt and document all orders in the approved clinical system.`}
function sendWhats(p){if(!itemsAction(p).length){alert('Enter an action under at least one checklist item first.');return}if(!confirm('This WhatsApp draft includes patient name, MRN, diagnosis, ward and clinical instructions. This is identifiable health information. Continue ONLY if the hospital has approved this communication channel.'))return;const digits=String(p.phone||'').replace(/\D/g,'');const url='https://wa.me/'+(digits||'')+'?text='+encodeURIComponent(whatsappText(p));window.open(url,'_blank','noopener')}
async function copyActions(p){const text=whatsappText(p);try{await navigator.clipboard.writeText(text);alert('Action summary copied.')}catch(e){prompt('Copy the message:',text)}}
function modal(content){document.getElementById('modalRoot').innerHTML=`<div class="modalmask"><div class="modal" role="dialog" aria-modal="true">${content}</div></div>`;document.querySelector('.modalmask').onclick=e=>{if(e.target===e.currentTarget)closeModal()}}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function patientModal(p){const isEdit=!!(p&&p.id&&state.patients.some(x=>x.id===p.id)),p0=p||{name:'',mrn:'',ward:state.wards[0],room:'',bed:'',diagnosis:'',priority:'stable',resident:'',phone:''};modal(`<div class="h"><h2>${isEdit?'Edit Patient':'Add Patient'}</h2><button class="close" id="closeModal">×</button></div><form id="patientForm"><div class="formgrid"><div><label>Patient Name</label><input id="pName" required value="${esc(p0.name)}" placeholder="Patient Name"></div><div><label>Medical Record Number (MRN)</label><input id="pMrn" required value="${esc(p0.mrn)}" placeholder="Medical Record Number"></div><div><label>Ward</label><div style="display:flex;gap:5px"><select id="pWard" required>${state.wards.map(w=>`<option ${p0.ward===w?'selected':''}>${esc(w)}</option>`).join('')}</select><button id="newWard" class="secondary" type="button" style="white-space:nowrap">＋ New Ward</button></div></div><div><label>Room Number</label><input id="pRoom" required value="${esc(p0.room)}" placeholder="e.g. 49"></div><div><label>Bed Number / Letter</label><input id="pBed" value="${esc(p0.bed)}" placeholder="e.g. A"></div><div><label>Priority</label><select id="pPriority"><option value="stable" ${p0.priority==='stable'?'selected':''}>🟢 Stable</option><option value="review" ${p0.priority==='review'?'selected':''}>🟡 Follow-up</option><option value="urgent" ${p0.priority==='urgent'?'selected':''}>🔴 Urgent</option></select></div><div class="full"><label>Diagnosis</label><input id="pDx" required value="${esc(p0.diagnosis)}" placeholder="Diagnosis / procedure"></div><div><label>Assigned Resident</label><input id="pRes" value="${esc(p0.resident)}" placeholder="Resident name"></div><div><label>Resident WhatsApp (optional, country code)</label><input id="pPhone" value="${esc(p0.phone)}" inputmode="tel" placeholder="9665XXXXXXXX"></div></div><div class="btnrow" style="margin-top:16px"><button class="primary" type="submit">Save Patient</button><button class="secondary" type="button" id="cancel">Cancel</button></div></form>`);document.getElementById('closeModal').onclick=closeModal;document.getElementById('cancel').onclick=closeModal;document.getElementById('newWard').onclick=()=>{const draft={name:document.getElementById('pName').value,mrn:document.getElementById('pMrn').value,ward:document.getElementById('pWard').value,room:document.getElementById('pRoom').value,bed:document.getElementById('pBed').value,diagnosis:document.getElementById('pDx').value,priority:document.getElementById('pPriority').value,resident:document.getElementById('pRes').value,phone:document.getElementById('pPhone').value};wardModal(draft,p)};
document.getElementById('patientForm').onsubmit=e=>{e.preventDefault();const data={name:document.getElementById('pName').value.trim(),mrn:document.getElementById('pMrn').value.trim(),ward:document.getElementById('pWard').value,room:document.getElementById('pRoom').value.trim(),bed:document.getElementById('pBed').value.trim(),diagnosis:document.getElementById('pDx').value.trim(),priority:document.getElementById('pPriority').value,resident:document.getElementById('pRes').value.trim(),phone:document.getElementById('pPhone').value.trim()};if(isEdit)Object.assign(p,data);else{p={id:'p'+Date.now()+Math.random().toString(36).slice(2,5),rounds:{},...data};state.patients.push(p)}persist();current=p.id;view='detail';render();window.scrollTo(0,0)};}
function wardModal(draft,p){modal(`<div class="h"><h2>Add New Ward</h2><button id="x" class="close">×</button></div><p class="muted">The new ward will be selected automatically in the patient form.</p><label>Ward Name</label><input id="wardName" placeholder="e.g. Trauma / SW"><div class="modal-list">${state.wards.map(x=>`<button class="secondary" type="button" disabled>${esc(x)}</button>`).join('')}</div><div class="btnrow"><button id="saveWard" class="primary">＋ Add Ward</button><button id="backWard" class="secondary">Back</button></div>`);document.getElementById('x').onclick=()=>patientModal({...draft,...(p?{id:p.id}:{} )});document.getElementById('backWard').onclick=()=>patientModal({...draft,...(p?{id:p.id}:{} )});document.getElementById('saveWard').onclick=()=>{const name=document.getElementById('wardName').value.trim();if(!name){alert('Enter a ward name.');return}const already=state.wards.find(w=>w.toLowerCase()===name.toLowerCase());if(!already){state.wards.push(name);persist()}draft.ward=already||name;patientModal(p?{...draft,id:p.id}:draft)};}
function paperBody(p,blank){let html=`<div class="printpage"><div class="printhead"><h2>Consultant Ward Round — Checklist</h2><div>Date: ${blank?'________________':esc(roundDate)}</div></div><div class="printrow"><b>Patient: ${blank?'________________________':esc(p.name)}</b><b>MRN: ${blank?'____________':esc(p.mrn)}</b><b>Ward: ${blank?'______':esc(p.ward)}</b><b>Room: ${blank?'____':esc(p.room)}</b><b>Bed: ${blank?'____':esc(p.bed)}</b></div><div class="printrow"><b>Diagnosis: ${blank?'_____________________________________':esc(p.diagnosis)}</b><b>Priority: ${blank?'______':esc(priorityMeta[p.priority]?.label||'')}</b></div>`;const r=blank?{}:getRound(p);for(const g of groups){html+=`<h3 style="font-size:13px;color:#0f4f82;margin:14px 0 7px">${esc(g.title)}</h3><div class="printgrid">`;for(const [k,label,en] of g.items){const o=r[k]||{};html+=`<div class="printitem"><strong>□ ${esc(label)} (${esc(en)})</strong><small>□ Reviewed   □ Action   □ N/A</small><em>Action: ${esc(o.action||'________________________________')}</em></div>`}html+='</div>'}html+=`<div class="printsummary"><b>Action Summary:</b>\n${blank?'_____________________________________________________________':esc(summaryText(p))}</div><div style="margin-top:12px;font-size:11px">Consultant: ___________________　Resident: ___________________</div></div>`;return html}
function printCase(p){document.getElementById('printRoot').innerHTML=paperBody(p,false);window.print()}
function printBlank(){const p={name:'',mrn:'',ward:'',room:'',bed:'',diagnosis:'',priority:'stable'};document.getElementById('printRoot').innerHTML=paperBody(p,true);window.print()}
window.addEventListener('afterprint',()=>document.getElementById('printRoot').innerHTML='');load();persist();render();
if ('serviceWorker' in navigator && location.protocol==='https:') window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
